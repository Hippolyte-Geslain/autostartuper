name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24 matches the version this project is developed on. Note that
      # `npm ci` here is stricter than any local run: on Linux npm walks the
      # dependency subtree of Tailwind's wasm fallback package, which npm on
      # Windows skips entirely. That is why @emnapi/core and @emnapi/runtime
      # are explicit devDependencies — see package.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The rule gate runs first: it is the fastest job and the one most likely
      # to fail, since it also fails on a rule that has gone stale without
      # anybody touching the code. `--min 14` catches a rules directory that
      # silently loses files — an empty directory is otherwise "valid".
      - run: npm run validate:rules -- --min 14

      - run: npm run lint
      - run: npm test

      # Typecheck runs after a build on purpose. Next generates route types
      # (`LayoutProps` and friends) into `.next/types`, so `tsc --noEmit` on a
      # fresh checkout fails on types that do not exist yet.
      - run: npm run build
      - run: npm run typecheck
