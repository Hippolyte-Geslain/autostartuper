name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24 to match the npm that writes package-lock.json locally. npm 10
      # (which ships with Node 22) rejects a lock npm 11 produced — it reports
      # optional wasm deps as "Missing from lock file" and `npm ci` fails before
      # a single test runs. Downgrading this breaks CI, not the lock.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The rule gate runs first: it is the fastest job and the one most likely
      # to fail, since it also fails on a rule that has gone stale without
      # anybody touching the code. `--min 14` catches a rules directory that
      # silently loses files — an empty directory is otherwise "valid".
      - run: npm run validate:rules -- --min 14

      - run: npm run lint
      - run: npm test

      # Typecheck runs after a build on purpose. Next generates route types
      # (`LayoutProps` and friends) into `.next/types`, so `tsc --noEmit` on a
      # fresh checkout fails on types that do not exist yet.
      - run: npm run build
      - run: npm run typecheck
