# Due every 15 December (the following business day when the 15th is a weekend).
# Businesses owing more than 3 000 € also pay an acompte on 15 June; the 15
# December date is the one every business shares, so it is the one modelled here.
# A business created during the year is EXONERATED from CFE for its creation
# year, and its minimum base is halved the second year. Most first-year users
# therefore owe nothing on this date. The engine has no creation-date input in
# v1, so the caveat lives here: M2 must gate this rule on the creation year
# before turning it into a "pay this" action.
# v1: rule scoped to micro; other forms in M2+. The CFE is owed whatever the
# legal form, so this scope is a product decision, not a fact — the filing that
# creates the liability (declaration-initiale-cfe) is micro-scoped in v1, and
# showing the payment to a user whose every other rule is absent would be a
# half-truth. Both open together in M2.
id: cfe-paiement
type: obligation
title: "Payer votre cotisation foncière des entreprises (CFE)"
schedule:
  kind: annual
  month: 12
  day: 15
applies_to:
  legal_forms: [micro]
source_url: https://www.impots.gouv.fr/professionnel/questions/comment-puis-je-acceder-mon-avis-de-cfe-et-le-payer
verified_on: 2026-08-09
valid_from: 2025-01-01
